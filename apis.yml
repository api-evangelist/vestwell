aid: vestwell
name: Vestwell
description: >-
  Vestwell is a New York City-based digital savings and retirement platform (founded 2016)
  that powers workplace savings programs for employers, financial advisors, financial
  institutions, TPAs, PEOs, payroll and benefit partners, and government agencies. Its
  recordkeeping and administration engine supports traditional and Safe Harbor 401(k),
  Solo-k, Starter-k, pooled/PEP plans, 403(b), 529 education savings, ABLE, emergency
  savings, student-loan repayment, and tuition reimbursement, as well as state-facilitated
  ("government savings") retirement programs. Vestwell emphasizes payroll and HR
  integrations (auto-sync across 190+ payroll providers) rather than a public developer
  API; onboarding, servicing, and saver access run through its web platform. Surfaced as a
  Lightspeed Venture Partners portfolio company and profiled here for the API Evangelist
  network.
